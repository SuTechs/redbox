<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A tiny, calming memory game. Watch the red boxes, then tap the others.">
  <meta name="theme-color" content="#FFF8ED">
  <meta property="og:title" content="Red Box — A tiny game. A little reset.">
  <meta property="og:description" content="Remember the red boxes, then enjoy tapping the others. Soothing music, endless shapes, and no rush.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sutechs.github.io/redbox/">
  <meta property="og:image" content="https://sutechs.github.io/redbox/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Red Box">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Red Box</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body{margin:0;background:#FFF8ED;color:#40342E;font-family:system-ui,sans-serif}
    #loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:16px}
    #loading img{width:112px;height:112px;margin:auto;border-radius:24px}
    #loading h1{margin:0;font-size:30px;letter-spacing:-1px}
    #loading p{margin:0;color:#806D5C;font-size:15px}
    #loading footer{position:fixed;bottom:24px;left:0;right:0;font-size:13px}
    #loading a{color:#806D5C}
    noscript{position:fixed;bottom:64px;left:24px;right:24px;text-align:center}
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="The smiling Red Box mascot">
    <h1>Red Box</h1>
    <p>Getting your little reset ready…</p>
    <footer><a href="privacy.html">Privacy</a> · <a href="support.html">Support</a></footer>
  </div>
  <noscript>Enable JavaScript to play Red Box. <a href="support.html">Get help</a></noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
