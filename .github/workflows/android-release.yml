name: Build signed Android bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze && flutter test
      - name: Restore upload key
        env:
          REDBOX_KEYSTORE_BASE64: ${{ secrets.REDBOX_KEYSTORE_BASE64 }}
        run: |
          test -n "$REDBOX_KEYSTORE_BASE64" || { echo 'Configure release secrets first.'; exit 1; }
          printf '%s' "$REDBOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/redbox-upload.jks"
          chmod 600 "$RUNNER_TEMP/redbox-upload.jks"
      - name: Build store bundle
        env:
          REDBOX_STORE_FILE: ${{ runner.temp }}/redbox-upload.jks
          REDBOX_STORE_PASSWORD: ${{ secrets.REDBOX_STORE_PASSWORD }}
          REDBOX_KEY_ALIAS: ${{ secrets.REDBOX_KEY_ALIAS }}
          REDBOX_KEY_PASSWORD: ${{ secrets.REDBOX_KEY_PASSWORD }}
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: redbox-google-play-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/redbox-upload.jks"
